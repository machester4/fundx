id: mvp-meta-reflection
description: Meta-reflection should distill 5 handoffs + 3 journal entries into specific, non-duplicative lessons routed to the correct memory files.
surface: meta_reflection
runs: 1
threshold: 1
fund_state:
  base: growth-with-handoffs
# NOTE: must_invoke/must_not_invoke/max_turns are not evaluated for meta_reflection
# surface because runMetaReflection returns void and tool_history is not captured
# (toolHistory: [], numTurns: 0). The judge dimensions below are the primary quality
# signal.
expect:
  judge:
    dims:
      specificity: 3
      non_duplication: 3
      routing: 3
      format: 3
      restraint: 3
